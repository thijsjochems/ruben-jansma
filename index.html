<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruben Jansma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b6e4f 0%, #1f9e6f 100%);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 640px;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.2;
      font-weight: 700;
    }
    .ball {
      font-size: clamp(3rem, 10vw, 5rem);
      display: block;
      margin-bottom: 1rem;
      animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-18px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="ball">🎾</span>
    <h1>Hoi, ik ben Ruben en ik hou van padel</h1>
  </div>
</body>
</html>
