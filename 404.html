<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina niet gevonden — Padel Escape</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A1A1A;
      color: #F5F2EB;
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 520px; }
    .code {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 200;
      font-size: clamp(4rem, 12vw, 7rem);
      letter-spacing: 0.15em;
      color: #B85A38;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 200;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    p {
      color: rgba(245, 242, 235, 0.55);
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 300;
      font-size: 0.8125rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #F5F2EB;
      text-decoration: none;
      background: #B85A38;
      border: 1px solid #B85A38;
      padding: 16px 36px;
      transition: opacity 0.3s ease;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Pagina niet gevonden</h1>
    <p>Deze pagina bestaat niet (meer). Ga terug naar de homepage om verder te kijken.</p>
    <a href="/">Terug naar home</a>
  </div>
</body>
</html>
